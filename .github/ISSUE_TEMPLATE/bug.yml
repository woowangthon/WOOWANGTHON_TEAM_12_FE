name: 버그
description: 동작이 SPEC 이나 기대와 다르다
labels: ["fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇이 잘못됐나
      description: 기대한 것 / 실제로 일어난 것
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      value: "1. "
  - type: textarea
    id: log
    attributes:
      label: 로그 · 화면
      render: text
  - type: input
    id: spec
    attributes:
      label: 관련 SPEC
      description: SPEC 에 없는 동작이면 「명세 없음」 — 버그가 아니라 sync-spec 대상인지 먼저 본다
      placeholder: "S-03"
  - type: textarea
    id: read
    attributes:
      label: 읽을 것
      description: 고치기 전에 읽을 문서 · 코드. 문서는 절까지
