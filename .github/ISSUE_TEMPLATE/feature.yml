name: 기능
description: SPEC 항목 하나를 이 레포에서 구현한다 (한 이슈 = 한 PR)
labels: ["feat"]
body:
  - type: input
    id: spec
    attributes:
      label: SPEC 참조
      placeholder: "F-01 / S-02"
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 무엇을 왜 — 지금은 어떤가 · 사용자에게 어떻게 보이나 · 기획 의도 · 어디서 나온 일인가(#이슈 · ADR). 누구의 에이전트든 이 본문만 보고 시작할 수 있게 쓴다. Notion 은 링크만 덧붙인다
    validations:
      required: true
  - type: textarea
    id: read
    attributes:
      label: 읽을 것
      description: 시작 전에 읽을 문서 · 코드. 문서는 파일 이름만 적지 말고 절까지 — 파일 이름만 있으면 전문을 읽게 된다. FE 화면이 바뀌면 ETC docs/design/chagok/ 의 그 화면과 docs/design/DESIGN.md 「시안과 일부러 다른 곳」도 적는다
      placeholder: "- docs/SPEC.md §0 제품 원칙 · R-01 F-03\n- docs/contracts/experience.md 「활동 조회」"
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      value: "- [ ] "
  - type: textarea
    id: out
    attributes:
      label: 범위 제외
  - type: textarea
    id: risk
    attributes:
      label: 위험 · 미결정
      description: 갈림길이 있으면 기본값도 같이 적는다 — 묻지 않고 진행할 수 있게. 유료 API 를 많이 부르는 일이면 여기 적는다
  - type: input
    id: blocked
    attributes:
      label: 선행 이슈
      description: 없으면 「없음」. 기술적으로 막힐 때만(계약 · API · 스키마 · 공용 코드) — 우선순위 · 스프린트 순서 · 일정은 적지 않는다(ADR-009). 적은 것은 전부 GitHub 선행(blocked by)으로도 건다 — 이슈 화면 Relationships 또는 `bash .claude/skills/plan-feature/link.sh blocked <이 이슈> <선행>`. 안 걸면 next-up 추천 순서가 틀린다
